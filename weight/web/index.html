<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7" id="themeColor">
<title>体重中枢 · 蚂蚁阿福秤</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%230066cc;stop-opacity:1'/%3E%3Cstop offset='100%25' style='stop-color:%230299ff;stop-opacity:1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3Cpath d='M20 32 Q20 24 28 24 Q36 24 36 32 L36 40 M28 32 Q28 26 32 26 Q36 26 36 32' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='44' r='2' fill='white'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230066cc'/%3E%3Cpath d='M20 32 Q20 24 28 24 Q36 24 36 32 L36 40' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  try {
    const savedTheme = localStorage.getItem("antaf-theme");
    const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = savedTheme || (systemDark ? "dark" : "light");
  } catch {
    document.documentElement.dataset.theme = "light";
  }
</script>
<link rel="stylesheet" href="/static/css/style.css?v=20261030-7">
</head>
<body>

<!-- 顶部状态栏 -->
<header class="top-bar">
  <div class="clock-display">
    <span class="clock-time" id="clockTime">--:--</span>
    <span class="clock-date" id="clockDate">----</span>
  </div>
  <div class="status-pills">
    <span class="pill pill-live" id="wsPill"><i class="dot"></i><span id="wsText">实时通道</span></span>
    <span class="pill pill-idle" id="scalePill"><i class="dot"></i><span id="scaleText">秤已连接</span></span>
    <button class="theme-toggle" id="themeToggle" type="button" title="切换深色模式" aria-label="切换深色模式">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<!-- 主画布：径向布局 -->
<main class="board">
  <!-- Three.js 背景 canvas -->
  <canvas id="threeCanvas"></canvas>
  
  <!-- 中心体重显示 -->
  <div class="center-weight">
    <div class="big-num" id="weightValue">--</div>
    <div class="unit">kg</div>
    <div class="time-badge" id="weightTime">上次测量 · --</div>
  </div>

  <!-- 轨道卡片 - BMI -->
  <div class="orbit-card orbit-bmi" id="cardBMI">
    <div class="orbit-label">BMI</div>
    <div class="orbit-value" id="bmiValue">--</div>
    <div class="orbit-grade" id="bmiGrade" data-tone="ok">标准</div>
  </div>

  <!-- 轨道卡片 - 体脂率 -->
  <div class="orbit-card orbit-fat" id="cardFat">
    <div class="orbit-label">体脂率</div>
    <div class="orbit-value" id="fatValue">--<small class="orbit-unit">%</small></div>
    <div class="orbit-grade" id="fatGrade" data-tone="warn">偏高</div>
  </div>

  <!-- 轨道卡片 - 肌肉量 -->
  <div class="orbit-card orbit-muscle" id="cardMuscle">
    <div class="orbit-label">肌肉量</div>
    <div class="orbit-value" id="muscleValue">--<small class="orbit-unit">kg</small></div>
    <div class="orbit-grade" id="muscleGrade" data-tone="ok">标准</div>
  </div>

  <!-- 轨道卡片 - 水分率 -->
  <div class="orbit-card orbit-water" id="cardWater">
    <div class="orbit-label">水分率</div>
    <div class="orbit-value" id="waterValue">--<small class="orbit-unit">%</small></div>
    <div class="orbit-grade" id="waterGrade" data-tone="ok">标准</div>
  </div>
</main>

<!-- 抽屉切换按钮 -->

<button class="drawer-toggle" id="drawerToggle" type="button" title="查看详细指标"
        aria-label="查看详细指标" aria-controls="metricsDrawer" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <polyline points="9 18 15 12 9 6"/>
  </svg>
</button>

<!-- 底部成员列表 -->
<footer class="bottom-members">
  <div class="members-scroll" id="memberList">
    <!-- 动态生成成员芯片 -->
  </div>
  <button class="member-chip member-add" id="addUserBtn" type="button" aria-label="新增成员">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    <span>新增成员</span>
  </button>
</footer>

<!-- 详细指标抽屉 -->
<aside class="metrics-drawer" id="metricsDrawer" aria-hidden="true">
  <section class="drawer-section" aria-labelledby="metricsTitle">
    <span class="section-label">Body composition</span>
    <h2 class="panel-title" id="metricsTitle">全部身体成分</h2>
    <div class="metrics-grid" id="metricsGrid">
      <!-- 动态生成所有指标 -->
    </div>
  </section>
  <section class="drawer-section drawer-history" aria-labelledby="recordsTitle">
    <span class="section-label">History</span>
    <h2 class="panel-title" id="recordsTitle">测量记录</h2>
    <div class="record-list drawer-records" id="recordList"></div>
  </section>
</aside>

<div id="modalLayer" class="veil" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head">
      <h3 id="modalTitle">新增成员</h3>
      <button id="modalClose" class="round-btn" type="button" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6l-12 12"/>
        </svg>
      </button>
    </header>
    <div id="modalBody" class="modal-body"></div>
    <footer id="modalFoot" class="modal-foot"></footer>
  </section>
</div>

<!-- 提示条 -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/static/js/bundle.js?v=20261030-6" defer></script>
</body>
</html>
