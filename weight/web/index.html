<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>体重中枢 · 蚂蚁阿福秤</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='3' width='18' height='18' rx='5' fill='none' stroke='%230066cc' stroke-width='2'/%3E%3Cpath d='M8.5 10a3.5 3.5 0 0 1 7 0v5' fill='none' stroke='%230066cc' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- 顶部状态栏 -->
<header class="top-bar">
  <div class="clock-display">
    <span class="clock-time" id="clockTime">--:--</span>
    <span class="clock-date" id="clockDate">----</span>
  </div>
  <div class="status-pills">
    <span class="pill pill-live" id="wsPill"><i class="dot"></i><span id="wsText">实时通道</span></span>
    <span class="pill pill-idle" id="scalePill"><i class="dot"></i><span id="scaleText">秤已连接</span></span>
  </div>
</header>

<!-- 主画布：径向布局 -->
<main class="board">

  <!-- 中心体重显示 -->
  <div class="center-weight">
    <div class="big-num" id="weightValue">--</div>
    <div class="unit">kg</div>
    <div class="time-badge" id="weightTime">上次测量 · --</div>
  </div>

  <!-- 轨道卡片 - BMI -->
  <div class="orbit-card orbit-bmi" id="cardBMI">
    <div class="orbit-label">BMI</div>
    <div class="orbit-value" id="bmiValue">--</div>
    <div class="orbit-grade" id="bmiGrade" data-tone="ok">标准</div>
  </div>

  <!-- 轨道卡片 - 体脂率 -->
  <div class="orbit-card orbit-fat" id="cardFat">
    <div class="orbit-label">体脂率</div>
    <div class="orbit-value" id="fatValue">--<small class="orbit-unit">%</small></div>
    <div class="orbit-grade" id="fatGrade" data-tone="warn">偏高</div>
  </div>

  <!-- 轨道卡片 - 肌肉量 -->
  <div class="orbit-card orbit-muscle" id="cardMuscle">
    <div class="orbit-label">肌肉量</div>
    <div class="orbit-value" id="muscleValue">--<small class="orbit-unit">kg</small></div>
    <div class="orbit-grade" id="muscleGrade" data-tone="ok">标准</div>
  </div>

  <!-- 轨道卡片 - 水分率 -->
  <div class="orbit-card orbit-water" id="cardWater">
    <div class="orbit-label">水分率</div>
    <div class="orbit-value" id="waterValue">--<small class="orbit-unit">%</small></div>
    <div class="orbit-grade" id="waterGrade" data-tone="ok">标准</div>
  </div>

  <!-- 抽屉切换按钮 -->
  <button class="drawer-toggle" id="drawerToggle" type="button" title="查看详细指标" aria-label="查看详细指标">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>

</main>

<!-- 底部成员列表 -->
<footer class="bottom-members">
  <div class="members-scroll" id="memberList">
    <!-- 动态生成成员芯片 -->
  </div>
</footer>

<!-- 详细指标抽屉 -->
<aside class="metrics-drawer" id="metricsDrawer">
  <h2 class="panel-title">全部身体成分</h2>
  <div class="metrics-grid" id="metricsGrid">
    <!-- 动态生成所有指标 -->
  </div>
</aside>

<!-- 提示条 -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/js/bundle.js" defer></script>
</body>
</html>
